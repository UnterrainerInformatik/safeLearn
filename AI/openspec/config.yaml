schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  archive:
    guidance:
      - >-
        Retire the backlog entry. Changes in this project often originate
        from an entry in AI/open-proposals.md, recorded as a line
        "Source: AI/open-proposals.md" near the top of the change's
        proposal.md, naming which entry (by its bold lead-in). After the
        change is archived successfully, read that line and delete the named
        entry from AI/open-proposals.md. Delete it, do not move the text
        anywhere: AI/open-proposals.md is fully tracked in git, so its history
        already preserves the original wording, and deleting the entry is
        what stops the session-start hook from offering the same request
        again.
      - >-
        If the change's proposal.md has no "Source:" line, or the named entry
        is no longer in AI/open-proposals.md, archive normally and change
        nothing - this is not an error.
      - >-
        State the outcome in the archive summary: which backlog entry was
        removed, or that no backlog entry had to be retired.
