services:

  safeLearn:
    image: ${DOCKER_HUB_USER}/${DOCKER_IMAGE_NAME}:latest
    container_name: safeLearn
    restart: unless-stopped
    ports:
      - ${WEBSERVER_PORT}:${INTERNAL_PORT}
    environment:
      - NEXT_PUBLIC_SERVER_URL=${PUBLIC_SERVER_URL}
      - NEXT_PUBLIC_START_PAGE=${PUBLIC_START_PAGE}
      - NEXT_AUTOSCAN=${AUTOSCAN}
      # "none" by default (.env): no sign-in, every reader holds READER_ROLES.
      - AUTH=${AUTH}
      - READER_ROLES=${READER_ROLES}
      # Only for AUTH=keycloak: signs the session cookies.
      - SESSION_SECRET=${SESSION_SECRET}
    volumes:
      - ${LOCAL_DEV_MD_DIR}:/app/md
      # Only for AUTH=keycloak. Left commented out otherwise: mounting a file
      # that does not exist makes Docker create a directory in its place.
      # - ./keycloak.json:/app/keycloak.json
